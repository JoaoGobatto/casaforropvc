<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa do Forro PVC — Forro PVC com instalação profissional</title>
<meta name="description" content="Equipe especializada em montagem de forro PVC. Do orçamento à entrega, com acabamento profissional.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     SEÇÃO 1 — HERO
     Estrutura copiada da referência Naftagaz, marca Casa do Forro PVC.
     ============================================================ -->
<section class="hero" id="hero">

  <!-- camada 1: foto de fundo com o movimento de abertura (zoom no
       centro → abre revelando a equipe). Ver css/style.css @keyframes -->
  <div class="hero__media" aria-hidden="true">
    <div class="hero__photo"></div>
  </div>

  <!-- camada 2: escurecimento pra legibilidade do texto -->
  <div class="hero__scrim" aria-hidden="true"></div>

  <!-- camada 3: marca gráfica gigante sangrando na direita -->
  <div class="hero__mark" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <path class="mark__house"
            d="M50 2 L100 40 L86 40 L86 98 L14 98 L14 40 L0 40 Z"/>
      <!-- a linha dourada é o forro: o plano horizontal dentro da casa -->
      <path class="mark__forro" d="M20 52 H80"/>
    </svg>
  </div>

  <!-- ---------- HEADER ---------- -->
  <header class="hd">

    <div class="hd__top">
      <a class="brand" href="#hero" aria-label="Casa do Forro PVC — página inicial">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path d="M50 6 L96 42 L84 42 L84 94 L16 94 L16 42 L4 42 Z"/>
            <path class="brand__line" d="M28 60 H72"/>
          </svg>
        </span>
        <span class="brand__type">
          <span class="brand__l1">CASA <em>do</em> FORRO</span>
          <span class="brand__l2">PVC</span>
        </span>
      </a>

      <div class="hd__actions">
        <a class="hd__phone" href="tel:+5500000000000">(00) 0000-0000</a>

        <a class="pill" href="https://wa.me/5500000000000" target="_blank" rel="noopener">
          <span>Orçamento no WhatsApp</span>
          <svg class="pill__chev" viewBox="0 0 12 8" aria-hidden="true">
            <path d="M1 1.5 L6 6.5 L11 1.5"/>
          </svg>
        </a>

        <a class="hd__ig" href="#" aria-label="Instagram da Casa do Forro PVC">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle class="dot" cx="17.2" cy="6.8" r="1.1"/>
          </svg>
        </a>

        <button class="hd__burger" type="button" aria-expanded="false" aria-controls="nav" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Navegação principal">
      <a class="nav__item" href="#empresa">Empresa <svg class="nav__chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 L6 6.5 L11 1.5"/></svg></a>
      <i class="nav__rule" aria-hidden="true"></i>
      <a class="nav__item" href="#servicos">Serviços <svg class="nav__chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 L6 6.5 L11 1.5"/></svg></a>
      <i class="nav__rule" aria-hidden="true"></i>
      <a class="nav__item" href="#obras">Obras</a>
      <i class="nav__rule" aria-hidden="true"></i>
      <a class="nav__item" href="#depoimentos">Depoimentos</a>
      <i class="nav__rule nav__rule--wide" aria-hidden="true"></i>
      <a class="nav__item" href="#orcamento">Orçamento</a>
      <i class="nav__rule" aria-hidden="true"></i>
      <a class="nav__item" href="#contato">Contato</a>
    </nav>
  </header>

  <!-- ---------- TÍTULO ---------- -->
  <div class="hero__copy">
    <h1 class="ttl">
      <span class="ttl__l1">Seu ambiente novo</span>
      <span class="ttl__l2">começa pelo teto</span>
    </h1>
    <p class="sub">
      Equipe especializada em montagem de<br>
      forro PVC, do orçamento à entrega.
    </p>
  </div>

  <!-- ---------- CARDS ---------- -->
  <div class="cards">
    <a class="card" href="#forro">
      <div class="card__head">
        <span class="card__name">Forro PVC</span>
        <span class="card__num">01</span>
      </div>
      <div class="card__thumb card__thumb--forro" aria-hidden="true"></div>
      <span class="card__go" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M4 12 L12 4 M6 4 h6 v6"/></svg>
      </span>
    </a>

    <a class="card" href="#acabamento">
      <div class="card__head">
        <span class="card__name">Acabamento</span>
        <span class="card__num">02</span>
      </div>
      <div class="card__thumb card__thumb--acab" aria-hidden="true"></div>
      <span class="card__go" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M4 12 L12 4 M6 4 h6 v6"/></svg>
      </span>
    </a>
  </div>

  <!-- ---------- SCROLL ---------- -->
  <a class="scroll" href="#proxima" aria-label="Ver mais">
    <svg viewBox="0 0 14 9" aria-hidden="true"><path d="M1 1.5 L7 7.5 L13 1.5"/></svg>
  </a>

</section>

<script>
  // menu mobile
  (function () {
    var burger = document.querySelector('.hd__burger');
    var nav = document.getElementById('nav');
    if (!burger || !nav) return;
    burger.addEventListener('click', function () {
      var open = burger.getAttribute('aria-expanded') === 'true';
      burger.setAttribute('aria-expanded', String(!open));
      burger.setAttribute('aria-label', open ? 'Abrir menu' : 'Fechar menu');
      nav.classList.toggle('is-open', !open);
      document.body.classList.toggle('nav-locked', !open);
    });
    nav.addEventListener('click', function (e) {
      if (e.target.closest('.nav__item')) {
        burger.setAttribute('aria-expanded', 'false');
        nav.classList.remove('is-open');
        document.body.classList.remove('nav-locked');
      }
    });
  })();
</script>

</body>
</html>
