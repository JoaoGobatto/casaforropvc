<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa do Forro PVC — Forro PVC com instalação profissional</title>
<meta name="description" content="Equipe especializada em montagem de forro PVC. Do orçamento à entrega, com o acabamento que o ambiente merece.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<!-- ============================================================
     SEÇÃO 1 — HERO
     Layout copiado da referência Fixbild.
     ============================================================ -->
<section class="hero" id="hero">

  <!-- fundo: círculo claro + círculo tracejado -->
  <div class="deco" aria-hidden="true">
    <span class="deco__glow"></span>
    <span class="deco__ring"></span>
  </div>

  <!-- ---------- BARRA FLUTUANTE ---------- -->
  <header class="bar" role="banner">
    <div class="bar__inner">

      <a class="logo" href="#hero" aria-label="Casa do Forro PVC — página inicial">
        <span class="logo__mark" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path d="M50 8 L94 42 L82 42 L82 92 L18 92 L18 42 L6 42 Z"/>
            <path class="logo__line" d="M30 60 H70"/>
          </svg>
        </span>
        <span class="logo__type">Casa do Forro</span>
      </a>

      <nav class="menu" id="menu" aria-label="Navegação principal">
        <a class="menu__item is-active" href="#hero" aria-current="page">Início</a>
        <a class="menu__item" href="#empresa">Empresa</a>
        <a class="menu__item menu__item--has-sub" href="#servicos">
          Serviços
          <svg class="menu__caret" viewBox="0 0 8 5" aria-hidden="true"><path d="M0 0 L4 5 L8 0 Z"/></svg>
        </a>
        <a class="menu__item" href="#obras">Obras</a>
        <a class="menu__item" href="#contato">Contato</a>
      </nav>

      <div class="bar__right">
        <a class="cart" href="#loja" aria-label="Carrinho, 1 item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 3.5h2.6l2.3 10.4h9.4l2.2-7.6H6.4"/>
            <circle cx="9.4" cy="19" r="1.5"/>
            <circle cx="16.6" cy="19" r="1.5"/>
          </svg>
          <span class="cart__badge">1</span>
        </a>

        <a class="btn btn--dark" href="#contato">
          Fale conosco
          <svg class="btn__arrow" viewBox="0 0 18 12" aria-hidden="true">
            <path d="M0 6h16M11.5 1 17 6l-5.5 5"/>
          </svg>
        </a>

        <button class="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
      </div>

    </div>
  </header>

  <!-- ---------- CONTEÚDO CENTRAL ---------- -->
  <main class="hero__inner" id="conteudo">

    <span class="badge">
      <span class="badge__icon" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <path d="M50 18 L88 48 L76 48 L76 84 L24 84 L24 48 L12 48 Z"/>
        </svg>
      </span>
      Solução completa em forro PVC
    </span>

    <h1 class="ttl">
      <span class="ttl__line">Ambiente <em>novo</em></span>
      <span class="ttl__line">começa pelo <em>teto</em></span>
    </h1>

    <p class="lead">
      Equipe especializada em montagem de forro PVC. Do orçamento à
      entrega, com o acabamento que o ambiente merece.
    </p>

    <div class="actions">
      <a class="tel" href="tel:+5500000000000">
        <svg class="tel__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.2 3.5 8.9 3.5 10.3 7.4 8.4 8.9c.9 2 2.6 3.7 4.6 4.7l1.5-2 3.9 1.4v2.7c0 .9-.7 1.6-1.6 1.6C10.2 22.3 4.6 16.7 4.6 5.1c0-.9.7-1.6 1.6-1.6Z"/>
        </svg>
        (00) 0000-0000
      </a>

      <a class="btn btn--dark" href="#orcamento">
        Peça um orçamento
        <svg class="btn__arrow" viewBox="0 0 18 12" aria-hidden="true">
          <path d="M0 6h16M11.5 1 17 6l-5.5 5"/>
        </svg>
      </a>
    </div>

  </main>

  <!-- círculos com foto de produto -->
  <figure class="orb orb--left" aria-hidden="true"><span class="orb__img"></span></figure>
  <figure class="orb orb--right" aria-hidden="true"><span class="orb__img"></span></figure>

  <!-- recorte da equipe: fecha a seção 1 e avança sobre a faixa escura -->
  <div class="crew" role="img" aria-label="Equipe da Casa do Forro PVC"></div>

</section>

<!-- faixa escura — início da seção 2. O recorte da equipe passa por cima
     dela, que é o que cria a emenda entre as duas seções. -->
<section class="strip" id="proxima" aria-label="Seção 2"></section>

<script>
  // menu mobile
  (function () {
    var burger = document.querySelector('.burger');
    var menu = document.getElementById('menu');
    if (!burger || !menu) return;

    function isOpen() {
      return burger.getAttribute('aria-expanded') === 'true';
    }

    function open() {
      burger.setAttribute('aria-expanded', 'true');
      burger.setAttribute('aria-label', 'Fechar menu');
      menu.classList.add('is-open');
      document.body.classList.add('menu-locked');

      // o painel vem ANTES do burger no DOM: sem mandar o foco pra dentro,
      // quem navega por teclado abre o menu e o Tab pula ele inteiro
      var first = menu.querySelector('.menu__item');
      if (first) first.focus();
    }

    // returnFocus: devolve o foco pro burger. Só quando o menu foi fechado
    // por teclado ou pelo próprio botão — num clique em item o foco segue
    // o link, e roubá-lo de volta atrapalharia.
    function close(returnFocus) {
      if (!isOpen()) return;
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Abrir menu');
      menu.classList.remove('is-open');
      document.body.classList.remove('menu-locked');
      if (returnFocus) burger.focus();
    }

    burger.addEventListener('click', function () {
      if (isOpen()) { close(true); return; }
      open();
    });

    menu.addEventListener('click', function (e) {
      if (e.target.closest('.menu__item')) close(false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close(true);
    });
  })();
</script>

</body>
</html>
